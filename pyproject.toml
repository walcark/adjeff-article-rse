[project]
name = "adjeff-article-rse"
version = "0.1.0"
authors = [{ name = "walcark", email = "kevin.walcarius@gmail.com" }]
description = "Companion scripts for Article 1 — adjacency effects in Sentinel-2 imagery."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/adjeff_article_rse"]

# ── Pixi workspace ────────────────────────────────────────────────────────────
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
adjeff-article-rse = { path = ".", editable = true }
adjeff = ">=0.5.1"

# Conda-only deps that adjeff needs but cannot declare on PyPI.
# All other adjeff deps (numpy, xarray, pydantic, ...) come transitively
# via adjeff's [project.dependencies] when installed from PyPI.
[tool.pixi.dependencies]
python = ">=3.11,<3.13"
smartg = ">=1.1.3,<2"
luts = ">=1.0.6,<2"
matplotlib = ">=3.9"
scienceplots = ">=2.0"
cuda-version = "12.6.*"
pytorch-gpu = "*"
cuda-cudart-dev = "12.6.*"
cuda-nvcc = "12.6.*"

[tool.pixi.system-requirements]
cuda = "12.6"

# ── Tâches ───────────────────────────────────────────────────────────────────
[tool.pixi.tasks]
figures-all = { cmd = "bash makefig" }
download_auxdata = { cmd = "python scripts/auxdata.py" }

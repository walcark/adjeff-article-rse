[project]
name = "adjeff-article-rse"
version = "0.1.0"
authors = [{ name = "walcark", email = "kevin.walcarius@gmail.com" }]
description = "Companion scripts for Article 1 — adjacency effects in Sentinel-2 imagery."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/adjeff_article_1"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
adjeff-article-rse = { path = ".", editable = true }
sensorsio = ">=1.0.2"
smartg = ">=2.0.1,<3"
adjeff = "==1.2.7"

[tool.pixi.dependencies]
python = ">=3.11,<3.13"
rasterio = ">=1.4.3,<2"
pycuda = "*"
geoclide = ">=4,<5"
matplotlib = ">=3.9"
scienceplots = ">=2.0"
numpy = ">=2.0"
xarray = ">=2026.1.0"
pandas = ">=2.0"
cuda-version = "12.9.*"
pytorch-gpu = "*"
cuda-cudart-dev = "12.9.*"
cuda-nvcc = "12.9.*"

[tool.pixi.system-requirements]
cuda = "12.0"

[tool.pixi.tasks]
figures-all = { cmd = "bash makefig" }
smoke = { cmd = "python generate/smoke.py" }
build-cams = { cmd = "python generate/sedoo/build_cams_auxdata.py" }
build-lut = { cmd = "python generate/sedoo/build_psf_lut.py" }

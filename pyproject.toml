[project]
name = "adjeff-article-rse"
version = "0.1.0"
authors = [{ name = "walcark", email = "kevin.walcarius@gmail.com" }]
description = "Companion scripts for Article 1 — adjacency effects in Sentinel-2 imagery."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/adjeff_article_1"]

# ── Pixi workspace ────────────────────────────────────────────────────────────
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
adjeff-article-rse = { path = ".", editable = true }
# Pinned: figures in this repo are reproduced against this exact release.
adjeff = "==0.6.0"
# Used lazily by adjeff's MAJA loader; PyPI-only, no conda-forge build.
sensorsio = ">=1.0.2"

# Conda-only deps that adjeff needs but cannot declare on PyPI (smartg pulls
# luts and geoclide transitively), plus what this repo imports directly.
[tool.pixi.dependencies]
python = ">=3.11,<3.13"
smartg = ">=1.2.0,<2"
matplotlib = ">=3.9"
scienceplots = ">=2.0"
numpy = ">=2.0"
xarray = ">=2026.1.0"
pandas = ">=2.0"
# CUDA >= 12.8 is required: nvcc only learns `sm_120` (Blackwell, RTX 50xx)
# there, and SMART-G compiles its kernels for the local compute capability.
cuda-version = "12.9.*"
pytorch-gpu = "*"
# pycuda compiles its kernels at runtime but does not declare nvcc itself.
cuda-cudart-dev = "12.9.*"
cuda-nvcc = "12.9.*"

[tool.pixi.system-requirements]
cuda = "12.9"

# ── Tâches ───────────────────────────────────────────────────────────────────
[tool.pixi.tasks]
figures-all = { cmd = "bash makefig" }
download_auxdata = { cmd = "python scripts/auxdata.py" }

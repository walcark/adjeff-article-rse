[project]
name = "adjeff-article-rse"
version = "0.1.0"
authors = [{ name = "walcark", email = "kevin.walcarius@gmail.com" }]
description = "Companion scripts for Article 1 — adjacency effects in Sentinel-2 imagery."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/adjeff_article_1"]

# ── Pixi workspace ────────────────────────────────────────────────────────────
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
adjeff-article-rse = { path = ".", editable = true }
# Used lazily by adjeff's MAJA loader; PyPI-only, no conda-forge build.
sensorsio = ">=1.0.2"
# Smart-G 2.0 has no conda-forge build yet; 1.2.0 was the last one.  Its
# pycuda dependency must still come from conda, see below.
smartg = ">=2.0.1,<3"

# Where adjeff comes from, as two mutually exclusive features.
#
# `release` is what the article claims: the figures were reproduced
# against this exact PyPI release, and it is the only one a reader of the
# paper needs.  `local` builds adjeff from a sibling checkout so that a
# change can be smoke-tested before it is tagged, which is what breaks
# the chicken-and-egg between the release and this repository's pin.
[tool.pixi.feature.release.pypi-dependencies]
adjeff = "==1.2.0"

[tool.pixi.feature.local.pypi-dependencies]
adjeff = { path = "../Adjeff", editable = true }

# Conda-only deps that adjeff and smartg need but cannot declare on PyPI,
# plus what this repo imports directly.
[tool.pixi.dependencies]
python = ">=3.11,<3.13"
# smartg hard-depends on pycuda, and it has to come from conda: the PyPI
# sdist compiles against `cudaProfiler.h`, which only the CUDA toolkit
# ships, and uv has no way to find it.
pycuda = "*"
# Smart-G 2.0 is built against geoclide 4, which is what lifted the
# `get_rotateX_tf` break that only adjeff's PSF sampler ever reached.
# Mirrors the bound adjeff sets; lift both together.
geoclide = ">=4,<5"
matplotlib = ">=3.9"
scienceplots = ">=2.0"
numpy = ">=2.0"
xarray = ">=2026.1.0"
pandas = ">=2.0"
# CUDA >= 12.8 is required: nvcc only learns `sm_120` (Blackwell, RTX 50xx)
# there, and SMART-G compiles its kernels for the local compute capability.
cuda-version = "12.9.*"
pytorch-gpu = "*"
# pycuda compiles its kernels at runtime but does not declare nvcc itself.
cuda-cudart-dev = "12.9.*"
cuda-nvcc = "12.9.*"

[tool.pixi.system-requirements]
# The driver floor, not the toolkit version: the three pins above stay at
# 12.9 because conda-forge builds pycuda against `cuda-version >=12.9`, and
# no 12.4 build of it exists.  CUDA 12 minor version compatibility runs that
# toolkit on any 12.x driver, so pinning this floor to the toolkit version
# would lock out the CNES servers (driver 12.4) for no reason.
cuda = "12.0"

# `local` needs ../Adjeff next to this repository; it is a development
# environment and is not required to reproduce the figures.
[tool.pixi.environments]
default = ["release"]
local = ["local"]

# ── Tâches ───────────────────────────────────────────────────────────────────
[tool.pixi.tasks]
figures-all = { cmd = "bash makefig" }
smoke = { cmd = "python generate/smoke.py" }
build-cams = { cmd = "python generate/sedoo/build_cams_auxdata.py" }
build-lut = { cmd = "python generate/sedoo/build_psf_lut.py" }
